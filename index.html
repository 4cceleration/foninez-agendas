<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Fonniñez · Agendas</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/agenda"><b>Fonniñez</b><span>Agendas</span></a>
    <nav class="nav">
      <a href="#/agenda" data-nav="agenda"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Agenda</span></a>
      <a href="#/mi" data-nav="mi"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-3.6 3.4-5.5 7.5-5.5s7.5 1.9 7.5 5.5"/></svg><span>Mi agenda</span></a>
      <a href="#/nueva" data-nav="nueva" class="nav-cta"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg><span>Nueva</span></a>
      <a href="#/seguimiento" data-nav="seguimiento"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Seguimiento</span></a>
      <a href="#/ajustes" data-nav="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Ajustes</span></a>
    </nav>
    <span class="yo" id="btnYo"></span>
    <a class="btn primary" href="#/nueva">+ Agenda</a>
    <button type="button" class="ghost" data-act="salir">Salir</button>
  </header>

  <section id="login" class="login" hidden>
    <form id="formLogin" class="login-card">
      <div class="login-brand">Fonniñez</div>
      <h1>Ingresar</h1>
      <div id="loginUser"></div>
      <label>Contraseña<input type="password" name="pass" required autocomplete="current-password"></label>
      <button class="primary">Ingresar</button>
    </form>
  </section>

  <main id="app"></main>

  <dialog id="dlgYo">
    <div class="dialog-head">
      <h2>¿Quién eres?</h2>
      <form method="dialog"><button class="ghost" aria-label="Cerrar">✕</button></form>
    </div>
    <div class="people" id="yoList"></div>
  </dialog>

  <datalist id="actividades">
    <option>Jornada de registro</option>
    <option>Visita domiciliaria</option>
    <option>Taller con familias</option>
    <option>Entrega de kits</option>
    <option>Seguimiento</option>
    <option>Reunión comunitaria</option>
  </datalist>

  <div id="print"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="xlsx.js?v=1"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
